name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
      - name: Build sdist and wheel (no publish)
        run: |
          python -m build
      - name: Record artifact checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          dist = pathlib.Path("dist")
          out = {}
          for p in sorted(dist.glob("*")):
              if p.is_file():
                  out[p.name] = hashlib.sha256(p.read_bytes()).hexdigest()
          print(json.dumps(out, indent=2))
          pathlib.Path("dist/checksums-sha256.json").write_text(json.dumps(out, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Isolated venv install smoke (outside checkout)
        shell: bash
        run: |
          python -m pytest -q tests/test_packaging.py -k "isolated_venv or wheel_excludes or packaged_resources or draft_plugin or sha256 or wheel_name"
