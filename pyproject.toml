[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-bot-build-bridge"
version = "0.32.2"
description = "Discovery, routing, and companion scaffolding for Grok Bot <-> Grok Build"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Grok Bot-Build Bridge contributors" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
dev = ["pytest>=8.0", "build>=1.2", "mcp>=1.28,<2"]

[project.scripts]
grok-bot-build-bridge = "grok_bot_build_bridge.cli:main"
grok-bot-build-bridge-mcp = "grok_bot_build_bridge.mcp_facade.server:main"

[project.urls]
Homepage = "https://github.com/kernoli85-cyber/Grok-Bot-Build-Bridge"
Documentation = "https://github.com/kernoli85-cyber/Grok-Bot-Build-Bridge#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["grok_bot_build_bridge*"]

[tool.setuptools.package-data]
"grok_bot_build_bridge" = [
  "resources/fixtures/*",
  "resources/skill/**/*",
  "resources/scripts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: builds wheel / isolated venv (MCP e2e)",
]
